name: "Bartholomew Autonomous AI Security Gate"
description: "Sub-millisecond cryptographic attestation, declarative YAML policy validation, and AST invariant auditing for AI agent workflows."
author: "Bartholomew AI Contributors"

branding:
  icon: "shield"
  color: "blue"

inputs:
  policy-file:
    description: "Path to declarative YAML/JSON security policy file"
    required: false
    default: "policies/default_security_policy.yaml"
  audit-path:
    description: "Target directory path to inspect"
    required: false
    default: "."
  fail-on-violation:
    description: "Whether to fail the CI build if policy violations or unsafe AST patterns are found"
    required: false
    default: "true"

outputs:
  audit-status:
    description: "Status of the security audit (PASSED or VIOLATIONS_DETECTED)"
  total-files-scanned:
    description: "Total files inspected during audit"

runs:
  using: "composite"
  steps:
    - name: "Set up Python Environment"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: "Install Bartholomew Security Dependencies"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pyyaml

    - name: "Validate Declarative Security Policy"
      shell: bash
      run: |
        python -m src.cli policy validate --file "${{ inputs.policy-file }}"

    - name: "Run Multi-Runtime Invariant Gate"
      shell: bash
      run: |
        python ci_security_gate.py
