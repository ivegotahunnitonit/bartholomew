name: 'Bartholomew Agentic Runtime Protection (ARP)'
description: 'Sub-35us deterministic AST execution gating, secret scrubbing, and Ed25519 Merkle receipts for AI agents & PRs.'
author: 'Autonomous Circularity Labs / Itsub Alemayehu'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  fail-on-violation:
    description: 'Whether to fail the workflow if an invariant or secret violation is detected.'
    required: false
    default: 'true'
  scan-path:
    description: 'Directory path to scan for AI agent code changes and invariant breaches.'
    required: false
    default: '.'
  spend-cap:
    description: 'Maximum allowable spend in USD for tool and API invocations.'
    required: false
    default: '50.0'

outputs:
  violations-count:
    description: 'Total number of detected security invariant and secret violations.'
    value: ${{ steps.run-btp.outputs.violations-count }}
  audit-receipt-hash:
    description: 'Cryptographic Ed25519 Merkle receipt digest for compliance.'
    value: ${{ steps.run-btp.outputs.audit-receipt-hash }}
  compliance-status:
    description: 'Audit compliance status (PASSED or FAILED).'
    value: ${{ steps.run-btp.outputs.compliance-status }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Bartholomew ARP Action
      id: run-btp
      shell: bash
      env:
        INPUT_FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
        INPUT_SCAN_PATH: ${{ inputs.scan-path }}
        INPUT_SPEND_CAP: ${{ inputs.spend-cap }}
      run: |
        python "${{ github.action_path }}/scripts/github_action_runner.py"
