name: 'BTP v2.2 Agent Action Guard'
description: 'Zero-network cryptographic attestation verification for AI-generated code and tool executions (Bartholomew Trust Protocol).'
author: 'Bartholomew Autonomous Systems'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  trusted_root_pubkey:
    description: 'Hex-encoded Ed25519 public key of the recognized root authority'
    required: true
  receipt_path:
    description: 'Filepath to the JSON BTP attestation receipt'
    required: false
    default: 'btp_receipt.json'
  candidate_payload_path:
    description: 'Filepath to the candidate payload or diff being evaluated'
    required: false
    default: 'payload.json'
  expected_recipient:
    description: 'Expected recipient execution context identifier'
    required: false
    default: ''
  enforce_strict:
    description: 'Fail the build if receipt is missing or invalid'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Cryptography
      shell: bash
      run: pip install --no-cache-dir cryptography>=41.0.0

    - name: Execute BTP v2.2 Offline Verification
      shell: bash
      run: |
        python ${{ github.action_path }}/scripts/run_github_action.py \
          --trusted-root "${{ inputs.trusted_root_pubkey }}" \
          --receipt "${{ inputs.receipt_path }}" \
          --payload "${{ inputs.candidate_payload_path }}" \
          --recipient "${{ inputs.expected_recipient }}" \
          --strict "${{ inputs.enforce_strict }}"
