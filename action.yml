name: "Bartholomew Autonomous AI Security Gate (BTP v2.3)"
description: "Sub-50µs cryptographic attestation, polyglot AST pre-flight invariant gating, and secret leakage prevention for autonomous AI agent pull requests."
author: "Bartholomew AI Contributors"

branding:
  icon: "shield"
  color: "green"

inputs:
  policy-file:
    description: "Path to declarative YAML/JSON security policy file"
    required: false
    default: "policies/default_security_policy.yaml"
  audit-path:
    description: "Target directory path to inspect"
    required: false
    default: "."
  fail-on-violation:
    description: "Whether to fail the CI build if policy violations or unsafe AST patterns are found"
    required: false
    default: "true"

outputs:
  audit-status:
    description: "Status of the security audit (PASSED or VIOLATIONS_DETECTED)"
  total-files-scanned:
    description: "Total files inspected during audit"

runs:
  using: "composite"
  steps:
    - name: "Set up Python Environment"
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: "Install btp-guard Official Package"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install btp-guard

    - name: "Execute Bartholomew Codebase & Agent Tool Audit"
      shell: bash
      run: |
        python -m btp_guard.cli_linter ${{ inputs.audit-path }}
