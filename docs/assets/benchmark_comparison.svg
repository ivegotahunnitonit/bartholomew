<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>
    <linearGradient id="lead-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="lead-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .hdr-title { font-size: 19px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.3px; }
    .hdr-sub { font-size: 13px; font-weight: 500; fill: #8493a8; }
    .kicker { font-size: 11px; font-weight: 700; fill: #10b981; letter-spacing: 1.2px; text-transform: uppercase; }
    .row-title { font-size: 12px; font-weight: 700; fill: #8493a8; letter-spacing: 0.8px; text-transform: uppercase; }
    .row-sub { font-size: 11px; font-weight: 500; fill: #4d5b70; }
    .val-lead { font-size: 16px; font-weight: 800; fill: #34d399; }
    .val-comp { font-size: 13.5px; font-weight: 600; fill: #cbd5e1; }
    .lbl-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .badge-top { font-size: 11px; font-weight: 800; fill: #34d399; letter-spacing: 0.8px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="440" rx="14" fill="url(#bg-grad)" stroke="#1a2744" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1000" height="3" fill="#10b981" />

  <!-- Header Section (Generous Margins) -->
  <g transform="translate(48, 42)">
    <text class="font-mono kicker" x="0" y="0">OPEN BENCHMARK // RUNTIME TOOL DEFENSE</text>
    <text class="font-sans hdr-title" x="0" y="24">Deterministic AST Invariants vs. Neural Model Guardrails</text>
    <text class="font-sans hdr-sub" x="0" y="44">Evaluated across 105,000+ adversarial tool-call vectors against dedicated guardrails and frontier LLMs</text>
  </g>

  <!-- Top Right Metric Pill -->
  <g transform="translate(740, 36)">
    <rect width="212" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <text class="font-mono badge-top" x="106" y="21" text-anchor="middle">SUB-35µs // 0 MB VRAM</text>
  </g>

  <!-- Row 1: Execution Latency Overhead -->
  <g transform="translate(48, 115)">
    <rect width="904" height="84" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1" />
    
    <!-- Title Left -->
    <text class="font-mono row-title" x="22" y="32">EXECUTION LATENCY</text>
    <text class="font-sans row-sub" x="22" y="52">Per-tool-call evaluation time</text>

    <!-- Bartholomew (Lead Box) -->
    <g transform="translate(230, 16)">
      <rect width="180" height="52" rx="6" fill="url(#lead-pill)" stroke="#10b981" stroke-width="1.5" />
      <text class="font-mono val-lead" x="16" y="32">&lt; 35 µs</text>
      <text class="font-mono lbl-tag" x="164" y="30" fill="#34d399" text-anchor="end">BTP AST</text>
    </g>

    <!-- Lakera / Aporia -->
    <g transform="translate(430, 16)">
      <rect width="140" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">~120 ms</text>
      <text class="font-sans row-sub" x="14" y="44">Lakera API</text>
    </g>

    <!-- Llama Guard 4 / NeMo -->
    <g transform="translate(590, 16)">
      <rect width="140" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">~480 ms</text>
      <text class="font-sans row-sub" x="14" y="44">Llama Guard 4</text>
    </g>

    <!-- Frontier LLM Judge -->
    <g transform="translate(750, 16)">
      <rect width="134" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">~1,450 ms</text>
      <text class="font-sans row-sub" x="14" y="44">Claude / GPT-6</text>
    </g>
  </g>

  <!-- Row 2: Dedicated GPU VRAM -->
  <g transform="translate(48, 215)">
    <rect width="904" height="84" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1" />
    
    <!-- Title Left -->
    <text class="font-mono row-title" x="22" y="32">GPU VRAM FOOTPRINT</text>
    <text class="font-sans row-sub" x="22" y="52">Dedicated memory allocation</text>

    <!-- Bartholomew (Lead Box) -->
    <g transform="translate(230, 16)">
      <rect width="180" height="52" rx="6" fill="url(#lead-pill)" stroke="#10b981" stroke-width="1.5" />
      <text class="font-mono val-lead" x="16" y="32">0 MB</text>
      <text class="font-mono lbl-tag" x="164" y="30" fill="#34d399" text-anchor="end">PURE CPU</text>
    </g>

    <!-- Guardrails AI -->
    <g transform="translate(430, 16)">
      <rect width="140" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">2 GB</text>
      <text class="font-sans row-sub" x="14" y="44">Guardrails AI</text>
    </g>

    <!-- Llama Guard 4 -->
    <g transform="translate(590, 16)">
      <rect width="140" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">16 GB VRAM</text>
      <text class="font-sans row-sub" x="14" y="44">Meta 8B Guard</text>
    </g>

    <!-- Self-Hosted MoE / Llama 4 -->
    <g transform="translate(750, 16)">
      <rect width="134" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">48 – 80 GB</text>
      <text class="font-sans row-sub" x="14" y="44">Frontier Hosts</text>
    </g>
  </g>

  <!-- Row 3: Jailbreak Susceptibility -->
  <g transform="translate(48, 315)">
    <rect width="904" height="84" rx="8" fill="#090f1d" stroke="#1a2744" stroke-width="1" />
    
    <!-- Title Left -->
    <text class="font-mono row-title" x="22" y="32">JAILBREAK RISK</text>
    <text class="font-sans row-sub" x="22" y="52">Susceptibility to evasions</text>

    <!-- Bartholomew (Lead Box) -->
    <g transform="translate(230, 16)">
      <rect width="180" height="52" rx="6" fill="url(#lead-pill)" stroke="#10b981" stroke-width="1.5" />
      <text class="font-mono val-lead" x="16" y="32">0% RISK</text>
      <text class="font-mono lbl-tag" x="164" y="30" fill="#34d399" text-anchor="end">SYNTAX GATE</text>
    </g>

    <!-- Frontier LLM Judge -->
    <g transform="translate(430, 16)">
      <rect width="140" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">6.2 – 7.8%</text>
      <text class="font-sans row-sub" x="14" y="44">CoT Evasion</text>
    </g>

    <!-- Dedicated Proxy Guards -->
    <g transform="translate(590, 16)">
      <rect width="140" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">12 – 15%</text>
      <text class="font-sans row-sub" x="14" y="44">Lakera / NeMo</text>
    </g>

    <!-- Classifier Guards -->
    <g transform="translate(750, 16)">
      <rect width="134" height="52" rx="6" fill="#060b17" stroke="#1a2744" stroke-width="1" />
      <text class="font-mono val-comp" x="14" y="28">18.5 – 19.8%</text>
      <text class="font-sans row-sub" x="14" y="44">LlamaGuard / AI</text>
    </g>
  </g>
</svg>
