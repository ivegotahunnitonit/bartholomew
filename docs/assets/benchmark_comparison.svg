<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purple-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .metric-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
    .val-highlight { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 20px; font-weight: 800; fill: #38bdf8; }
    .val-standard { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #64748b; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 40)">
    <text class="title" x="0" y="0">PERFORMANCE &amp; ARCHITECTURAL BENCHMARK</text>
    <text class="subtitle" x="0" y="22">Bartholomew Deterministic Invariant Gating vs. Heavy Model-Based Guardrails</text>
  </g>

  <!-- Highlight Pill Right -->
  <g transform="translate(730, 24)">
    <rect width="198" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text class="badge" x="99" y="20" fill="#38bdf8" text-anchor="middle">⚡ 18,500x FASTER ON CPU</text>
  </g>

  <!-- Metric 1: Latency -->
  <g transform="translate(32, 90)">
    <rect width="896" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text class="metric-title" x="24" y="28">EXECUTION LATENCY OVERHEAD</text>
    <text class="subtitle" x="24" y="52">Per tool call evaluation</text>
    
    <!-- Comparison bars/values -->
    <!-- Bartholomew -->
    <g transform="translate(300, 16)">
      <rect width="140" height="42" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text class="val-highlight" x="18" y="28">&lt; 35 µs</text>
      <text class="badge" x="126" y="26" fill="#38bdf8" text-anchor="end">BTP</text>
    </g>
    <!-- NeMo -->
    <g transform="translate(480, 16)">
      <rect width="170" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="val-standard" x="16" y="26">~450 ms</text>
      <text class="subtitle" x="156" y="26" text-anchor="end" font-size="11">NeMo</text>
    </g>
    <!-- Llama Guard 3 -->
    <g transform="translate(680, 16)">
      <rect width="190" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="val-standard" x="16" y="26">~650 ms</text>
      <text class="subtitle" x="176" y="26" text-anchor="end" font-size="11">LlamaGuard 3</text>
    </g>
  </g>

  <!-- Metric 2: GPU VRAM -->
  <g transform="translate(32, 180)">
    <rect width="896" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text class="metric-title" x="24" y="28">GPU VRAM CONSUMPTION</text>
    <text class="subtitle" x="24" y="52">Dedicated memory footprint</text>
    
    <!-- Bartholomew -->
    <g transform="translate(300, 16)">
      <rect width="140" height="42" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text class="val-highlight" x="18" y="28">0 MB</text>
      <text class="badge" x="126" y="26" fill="#38bdf8" text-anchor="end">CPU</text>
    </g>
    <!-- NeMo -->
    <g transform="translate(480, 16)">
      <rect width="170" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="val-standard" x="16" y="26">4 – 8 GB</text>
      <text class="subtitle" x="156" y="26" text-anchor="end" font-size="11">Colang</text>
    </g>
    <!-- Llama Guard 3 -->
    <g transform="translate(680, 16)">
      <rect width="190" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="val-standard" x="16" y="26">16 GB (8B)</text>
      <text class="subtitle" x="176" y="26" text-anchor="end" font-size="11">PyTorch</text>
    </g>
  </g>

  <!-- Metric 3: Enforcement Model -->
  <g transform="translate(32, 270)">
    <rect width="896" height="74" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text class="metric-title" x="24" y="28">ENFORCEMENT MODEL &amp; GUARANTEE</text>
    <text class="subtitle" x="24" y="52">Protection consistency &amp; jailbreak resistance</text>
    
    <!-- Bartholomew -->
    <g transform="translate(300, 16)">
      <rect width="140" height="42" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text class="val-highlight" x="14" y="28" font-size="13">100% INVARIANT</text>
    </g>
    <!-- NeMo -->
    <g transform="translate(480, 16)">
      <rect width="170" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="val-standard" x="14" y="26" font-size="13">Semantic / Fuzzy</text>
    </g>
    <!-- Llama Guard 3 -->
    <g transform="translate(680, 16)">
      <rect width="190" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="val-standard" x="14" y="26" font-size="13">Probabilistic (Vulnerable)</text>
    </g>
  </g>
</svg>
