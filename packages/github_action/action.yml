name: 'Bartholomew Agentic Runtime Protection (ARP) CI/CD Action'
description: 'Sub-35us deterministic AST invariant execution firewall and zero-leak credential audit for autonomous AI agents'
author: 'Bartholomew AI Inc.'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  audit-path:
    description: 'Target path or repository directory to audit for AST invariant safety and unredacted secrets'
    required: false
    default: '.'
  fail-on-violation:
    description: 'Fail CI/CD build step if invariant policy violation or unredacted credential is detected'
    required: false
    default: 'true'
  run-ast-benchmark:
    description: 'Run sub-35us in-process AST invariant benchmark suite'
    required: false
    default: 'true'
  export-telemetry:
    description: 'Export audit execution traces to OpenTelemetry (OTel) JSON artifact'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub Token for posting PR audit scorecard comment'
    required: false
    default: '${{ github.token }}'

outputs:
  compliance-status:
    description: 'SOC2_PASSED or INVARIANT_VIOLATION compliance status'
  audit-receipt-sha256:
    description: 'RFC 8785 Canonical JSON SHA-256 cryptographic execution receipt digest'
  eval-latency-us:
    description: 'Average in-process evaluation latency in microseconds'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bartholomew Guard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install btp-guard cryptography pyyaml

    - name: Run Bartholomew Invariant Audit
      shell: bash
      run: |
        btp-guard benchmark ast --vectors 1000 --out btp_audit_receipt.json

    - name: Export OpenTelemetry Artifacts
      if: inputs.export-telemetry == 'true'
      shell: bash
      run: |
        btp-guard export-telemetry --format otel --count 100 --out btp_otel_traces.json
