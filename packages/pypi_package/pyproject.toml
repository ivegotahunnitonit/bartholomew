[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-guard"
version = "5.4.11"
authors = [
  { name="Itsub Alemayehu", email="security@bartholomew.info" },
]
description = "BTP v5.4.10 Universal Cryptographic Trust Guard for Autonomous Agent Frameworks (LangGraph, AutoGen, CrewAI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://bartholomew.info"
Documentation = "https://github.com/ivegotahunnitonit/bartholomew/tree/main/docs"
Repository = "https://github.com/ivegotahunnitonit/bartholomew"
Changelog = "https://github.com/ivegotahunnitonit/bartholomew/tree/main/docs/release-notes-v2.4.0.md"
Tracker = "https://github.com/ivegotahunnitonit/bartholomew/issues"
