# Smithery MCP Server Specification for Bartholomew BTP Guard
# Official registry configuration for Claude Desktop, Cursor, and Windsurf
name: "@bartholomew/mcp-server"
description: "Sub-5 microsecond pre-flight cryptographic guardrails, spend caps, and LDMU loop termination for Claude Desktop and Cursor."
version: "2.2.0"
runtime: "python"
entrypoint: "mcp_server/server.py"
configSchema:
  type: object
  properties:
    spendCap:
      type: number
      description: "Maximum financial spend cap in USD for autonomous tools."
      default: 50.0
    maxRetries:
      type: integer
      description: "Maximum repetitive tool invocations before LDMU loop damping halts execution."
      default: 5
    sandboxRoot:
      type: string
      description: "Restricted workspace path for file containment."
      default: "."
command:
  type: stdio
  executable: python
  args:
    - "-m"
    - "mcp_server.server"
