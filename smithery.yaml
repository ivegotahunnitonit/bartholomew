# Smithery MCP Server Specification for Bartholomew BTP Guard
# Official registry configuration for Claude Desktop, Cursor, and Windsurf
name: "@ivegotahunnitonit/bartholomew"
description: "Sub-microsecond (0.95µs) OS computer-use gating, Copy-on-Write rollbacks, and in-flight secret protection for Claude Desktop, Cursor, and MCP clients."
version: "2.5.0"
runtime: "python"
entrypoint: "src/mcp_gateway.py"
configSchema:
  type: object
  properties:
    spendCap:
      type: number
      description: "Maximum financial spend cap in USD for autonomous tools."
      default: 50.0
    maxRetries:
      type: integer
      description: "Maximum repetitive tool invocations before LDMU loop damping halts execution."
      default: 5
    sandboxRoot:
      type: string
      description: "Restricted workspace path for file containment."
      default: "."
command:
  type: stdio
  executable: python
  args:
    - "-m"
    - "src.mcp_gateway"
