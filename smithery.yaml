# Smithery.ai MCP Registry Configuration for Bartholomew (BTP v5.4.14)
# https://smithery.ai/docs/config#smitheryyaml

version: 1.0.0
name: "bartholomew"
displayName: "Bartholomew AI Security Guard & SOC 2 Auditor"
description: "Sub-35µs in-process AST security gate, machine discovery manifest (.well-known/btp.json), secret scrubber, delegation chains, dispute arbitration, and L402 Lightning settlement for AI agent swarms."
homepage: "https://bartholomew.info"
repository: "https://github.com/ivegotahunnitonit/bartholomew"
icon: "https://raw.githubusercontent.com/ivegotahunnitonit/bartholomew/main/web/public/shield-icon.png"

tags:
  - security
  - agents
  - mcp
  - l402
  - lightning
  - ast
  - claude
  - cursor
  - guardrails

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      workspace_root:
        type: string
        description: "Path to the root of the workspace being guarded"
        default: "."
      log_level:
        type: string
        description: "Logging level (INFO, DEBUG, ERROR)"
        default: "INFO"
    additionalProperties: false
  command: "python"
  args:
    - "mcp_server.py"

build:
  npm:
    package: "btp-guard"
    command: "npx -y btp-guard mcp run"
