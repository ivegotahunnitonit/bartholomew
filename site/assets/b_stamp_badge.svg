  <text x="46" y="20" font-family="'JetBrains Mono', Inter, monospace" font-size="10.5" font-weight="700" fill="#f8fafc" letter-spacing="0.2">
    B-Stamp <tspan fill="url(#goldTxt)">Verified</tspan>
  </text>
  
  <!-- Emerald Status Pill -->
