<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Bartholomew Verified B-Stamp Security Seal">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="darkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#060910" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Starburst / Notches -->
  <g transform="translate(160,160)">
    <circle r="152" fill="none" stroke="url(#goldRim)" stroke-width="3" opacity="0.4" />
    <circle r="146" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6" />
  </g>

  <!-- Heavy Outer Ring -->
  <circle cx="160" cy="160" r="140" fill="url(#darkCore)" stroke="url(#goldRim)" stroke-width="7" filter="url(#goldGlow)" />

  <!-- Inner Bezel Ring -->
  <circle cx="160" cy="160" r="118" fill="none" stroke="url(#goldRim)" stroke-width="2" opacity="0.8" />
  <circle cx="160" cy="160" r="114" fill="#050811" stroke="#10b981" stroke-width="1.5" opacity="0.9" />

  <!-- Circular Text Path -->
  <path id="textCircle" d="M 50,160 A 110,110 0 1,1 270,160 A 110,110 0 1,1 50,160" fill="none" />
  <text font-family="'JetBrains Mono', 'Inter', monospace" font-size="10.5" font-weight="800" fill="#fbbf24" letter-spacing="3.2">
    <textPath href="#textCircle" startOffset="5%">
      BARTHOLOMEW TRUST PROTOCOL ★ 550+ INVARIANTS VERIFIED ★
    </textPath>
  </text>

  <!-- Center Shield Icon -->
  <g transform="translate(160,146)">
    <!-- Shield Outline -->
    <path d="M 0,-48 L 38,-30 C 38,20 0,54 0,54 C 0,54 -38,20 -38,-30 Z" fill="rgba(16, 185, 129, 0.12)" stroke="url(#emeraldShield)" stroke-width="3.5" />
    <!-- Inner Shield Accent -->
    <path d="M 0,-42 L 32,-26 C 32,16 0,46 0,46 C 0,46 -32,16 -32,-26 Z" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5" />
    
    <!-- Iconic Monogram "B" -->
    <text x="0" y="16" font-family="'Inter', 'Georgia', serif" font-size="44" font-weight="900" fill="url(#goldRim)" text-anchor="middle" filter="url(#goldGlow)">B</text>
  </g>

  <!-- Bottom Ribbon / Seal Designation -->
  <g transform="translate(160,230)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#03060a" stroke="url(#goldRim)" stroke-width="1.5" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1.5">VERIFIED B-STAMP</text>
  </g>

  <!-- Bottom Attestation Subtext -->
  <text x="160" y="272" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    FIPS 186-5 ED25519 • ZERO-LEAK
  </text>
</svg>
