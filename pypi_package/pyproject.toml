[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-guard"
version = "2.2.0"
authors = [
  { name="Bartholomew Autonomous Systems", email="help@bartholomew.info" },
]
description = "BTP v2.2 Universal Cryptographic Trust Guard for Autonomous Agent Frameworks (LangGraph, AutoGen, CrewAI)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.urls]
"Homepage" = "https://www.bartholomew.info"
"Specification" = "https://github.com/ivegotahunnitonit/bartholomew/blob/main/BTP_PROTOCOL_SPECIFICATION.md"
"Challenge Package" = "https://github.com/ivegotahunnitonit/bartholomew/blob/main/CHALLENGE_PACKAGE.md"
"Bug Tracker" = "https://github.com/ivegotahunnitonit/bartholomew/issues"
