[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-guard"
version = "2.8.0"
description = "Bartholomew Autonomous Trust Protocol (BTP v2.8) — FROST RFC 9591 & BIP 327 Threshold Signatures, Ring-0 eBPF Syscall Traps, Post-Quantum Hybrids, and ZK Invariant Proofs for AI Agents."
readme = "README.md"
authors = [
    { name = "Itsub Alemayehu", email = "security@bartholomew.info" }
]
license = { text = "MIT" }
keywords = ["ai-safety", "agent-guardrails", "security", "ast-analysis", "ed25519", "rfc8785", "mcp", "claude-desktop", "cursor", "frost", "zk-proofs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.22.0"]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://bartholomew.info"
Documentation = "https://bartholomew.info#sdk"
Repository = "https://github.com/ivegotahunnitonit/bartholomew"
Tracker = "https://github.com/ivegotahunnitonit/bartholomew/issues"

[project.scripts]
bartholomew = "src.cli:main"
btp-guard = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "btp_guard*", "daemon*"]
