[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-guard"
version = "5.4.10"
description = "Bartholomew Autonomous Trust Protocol (BTP v5.4.10) -- Sovereign Sentinel Companion & Autonomous AI Agent Execution Gateway: Sub-35us AST Gating, Frontier Model Wire Protection for GPT-Astra, Claude 3.7 Hybrid Thinking, Gemini 2.0, DeepSeek-R1, and Multi-Agent Frameworks."
readme = "README.md"
authors = [
    { name = "Itsub Alemayehu", email = "security@bartholomew.info" }
]
license = { text = "MIT" }
keywords = ["ai-safety", "agent-guardrails", "security", "ast-analysis", "ed25519", "rfc8785", "mcp", "claude-desktop", "cursor", "frost", "zk-proofs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.22.0"]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://bartholomew.info"
Documentation = "https://bartholomew.info#sdk"
Repository = "https://github.com/ivegotahunnitonit/bartholomew"
Tracker = "https://github.com/ivegotahunnitonit/bartholomew/issues"

[project.scripts]
bartholomew = "src.cli:main"
btp-guard = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "btp_guard*", "daemon*", "framework_adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["workspace*", "target-project*", "dist*", "build*", "node_modules*", "pypi_package*"]

