[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-guard"
version = "2.2.0"
authors = [
    { name = "Bartholomew Protocol Team", email = "security@bartholomew.dev" }
]
description = "Sub-millisecond cryptographic invariant and safety guardrail engine for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography"
]

[project.urls]
"Homepage" = "https://github.com/ivegotahunnitonit/bartholomew"
"Bug Tracker" = "https://github.com/ivegotahunnitonit/bartholomew/issues"

[project.scripts]
bartholomew = "src.cli:main"
btp = "src.cli:main"

[tool.pyright]
pythonVersion = "3.10"
include = ["."]
extraPaths = ["."]
