trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    python -m pip install cryptography pyyaml pytest pytest-timeout fastapi httpx requests uvicorn
  displayName: 'Install dependencies'

- script: |
    python -m pytest tests/test_authorization_gate_mvp.py tests/test_v31_agent_passport_and_discovery.py tests/test_m2m_benchmark_and_manifest.py tests/test_delegation_and_reputation.py tests/test_dispute_and_replay.py -q
  displayName: 'Run Bartholomew BTP test suite'
