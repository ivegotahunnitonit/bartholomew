trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Python311
    displayName: Python 3.11 security gate
    timeoutInMinutes: 15
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        displayName: Use Python 3.11
        inputs:
          versionSpec: '3.11'
          addToPath: true
          architecture: 'x64'

      - script: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pyyaml pytest pytest-timeout fastapi httpx requests uvicorn
        displayName: Install dependencies

      - script: |
          python -m pytest tests/test_usage_and_activation.py tests/test_authorization_gate_mvp.py tests/test_simple_guard.py -q
        displayName: Run focused guard and billing tests
