# Google Cloud Build Manifest for Agentic-Eval Production Deployment
steps:
  # 1. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agentic-eval-service:$COMMIT_SHA', '-f', 'Dockerfile.standalone', '.']

  # 2. Push image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agentic-eval-service:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agentic-eval-service'
      - '--image=gcr.io/$PROJECT_ID/agentic-eval-service:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'

images:
  - 'gcr.io/$PROJECT_ID/agentic-eval-service:$COMMIT_SHA'
