version: '3.8'

services:
  btp-authority:
    image: bartholomew/btp-authority:2.2.0
    build:
      context: .
      dockerfile: docker/Dockerfile.enclave
    container_name: bartholomew-btp-enclave
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BTP_PORT=8080
      - BTP_TTL_SECONDS=300
      - BTP_STRICT_MODE=true
      - BTP_AIR_GAPPED=true
      - BTP_METRICS_ENABLED=true
    volumes:
      - ./keys:/etc/btp/keys:ro
      - ./ledger:/var/log/btp/ledger
    networks:
      - btp-isolated-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v2.2/trust-roots"]
      interval: 10s
      timeout: 3s
      retries: 3

  btp-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: bartholomew-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - btp-isolated-network

networks:
  btp-isolated-network:
    driver: bridge
    internal: false
