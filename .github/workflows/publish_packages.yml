name: Publish Packages to PyPI and NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish-pypi:
    name: Build & Publish Python Wheel (PyPI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing (OIDC)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel setuptools

      - name: Build Python Distribution Wheels
        run: |
          cd pypi_package
          python -m build

      - name: Verify Built Artifacts
        run: |
          twine check pypi_package/dist/*

      - name: Upload Python Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: pypi_package/dist/

      - name: Publish to PyPI (Token Auth)
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload pypi_package/dist/* --skip-existing

  build-and-publish-npm:
    name: Build & Publish Node Package (NPM)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Test Node Verifier
        run: |
          cd npm_package
          npm test

      - name: Publish to NPM Registry
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm_package
          npm publish --access public
