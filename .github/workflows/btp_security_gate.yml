name: Bartholomew Security & Multi-Runtime Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Verify Multi-Language Invariants & Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography fastapi httpx pyyaml pytest

      - name: 1. Validate Declarative Security Policies
        run: |
          python -m src.cli policy validate --file policies/default_security_policy.yaml

      - name: 2. Test Python Cryptographic Core & Invariants
        run: |
          python test_declarative_policy_engine.py
          python sidecar/test_sidecar_e2e.py

      - name: 3. Test TypeScript/Node.js SDK
        run: |
          cd sdk_typescript
          node test_ts_sdk.js

      - name: 4. Test Go Microsecond Engine
        run: |
          cd sdk_go
          go test -v ./...

      - name: 5. Execute Multi-Agent Swarm Concurrency Verification
        run: |
          python test_multi_agent_swarm_stress.py
