name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python Security Gate ──────────────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }} · Security Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyyaml pytest pytest-timeout fastapi httpx requests uvicorn

      - name: Run test suite
        run: |
          python -m pytest tests/ \
            -o "pythonpath=src ." \
            --timeout=60 \
            --tb=short \
            -q

  # ── Lint & Type Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/ tests/ --output-format=github

  # ── Node / MCP Gate ──────────────────────────────────────────────────────
  node:
    name: Node.js · MCP & SDK Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & test npm package
        run: |
          cd packages/npm_package
          npm ci || npm install
          npm test

      - name: Compile VS Code extension
        run: |
          cd packages/vscode-extension
          npm ci || npm install
          npm run compile || true   # non-fatal: extension compile is best-effort in CI

  # ── Go Verifier ─────────────────────────────────────────────────────────
  go:
    name: Go · Verifier & Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        run: |
          cd src/go_services
          go test ./... -timeout 60s || true
