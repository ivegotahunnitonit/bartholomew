# Google Cloud Build Manifest for Bartholomew Production Deployment
steps:
  # 1. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bartholomew-daemon:$COMMIT_SHA', '-f', 'Dockerfile.standalone', '.']

  # 2. Push image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bartholomew-daemon:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run (bartholomew-daemon)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bartholomew-daemon'
      - '--image=gcr.io/$PROJECT_ID/bartholomew-daemon:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'

images:
  - 'gcr.io/$PROJECT_ID/bartholomew-daemon:$COMMIT_SHA'
